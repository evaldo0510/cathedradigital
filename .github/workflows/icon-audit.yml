name: Icon Audit CI

on:
  pull_request:
    paths:
      - 'src/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Run Icon Audit
        run: bun test src/components/__tests__/icon-audit.test.tsx
