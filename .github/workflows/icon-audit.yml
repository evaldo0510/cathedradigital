name: Design System Governance CI

on:
  pull_request:
    paths:
      - 'src/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install
        
      - name: Run Icon Audit
        run: bun test src/components/__tests__/icon-audit.test.tsx
        
      - name: Generate Compliance Report
        run: bun run src/scripts/generate-compliance-report.ts
        
      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: compliance-report.md
          
      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: |
            compliance-report.json
            compliance-report.html
            compliance-report.md
            src/scripts/history/compliance-history.json
            
      - name: Check Thresholds
        run: |
          OVERALL_SCORE=$(node -e "const r=require('./compliance-report.json'); console.log(r.reduce((acc, curr) => acc + (curr.layout+curr.cards+curr.theme+curr.tokens)/4, 0) / r.length)")
          echo "Overall Design System Compliance: $OVERALL_SCORE%"
          if (( $(echo "$OVERALL_SCORE < 80" | bc -l) )); then
            echo "Compliance score is below threshold (80%)"
            exit 1
          fi

