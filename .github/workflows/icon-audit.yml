name: Design System Governance CI

on:
  pull_request:
    paths:
      - 'src/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install --ignore-scripts
        
      - name: Run Icon Audit
        run: bun test src/components/__tests__/icon-audit.test.tsx
        
      - name: Generate Compliance Report
        run: |
          bun add js-yaml --ignore-scripts
          bun run src/scripts/generate-compliance-report.ts
        
      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: compliance-report.md
          
      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: |
            compliance-report.json
            summary.json
            compliance-report.html
            compliance-report.md
            src/scripts/history/compliance-history.json
            
      - name: Check Thresholds
        run: |
          OVERALL_SCORE=$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('./summary.json', 'utf8')); console.log(s.overall_score)")
          THRESHOLD=$(node -e "const fs=require('fs'); const yaml=require('js-yaml'); const c=yaml.load(fs.readFileSync('./compliance-config.yml', 'utf8')); console.log(c.compliance_thresholds.overall)")
          echo "Overall Design System Compliance: $OVERALL_SCORE% (Threshold: $THRESHOLD%)"
          if (( $(echo "$OVERALL_SCORE < $THRESHOLD" | bc -l) )); then
            echo "Compliance score is below threshold!"
            exit 1
          fi
