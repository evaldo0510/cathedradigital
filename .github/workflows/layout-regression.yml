name: Layout Governance & Visual Regression

on:
  pull_request:
    branches: [main, master]

jobs:
  audit:
    name: Layout Governance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Run Layout Audit
        run: bun run scripts/audit-layout-governance.ts

  accessibility:
    name: Accessibility & UX Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [ 'iPhone SE', 'iPhone 14 Pro Max', 'Pixel 7', 'mobile-320', 'mobile-412' ]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Accessibility Tests
        run: bunx playwright test tests/e2e/catecismo-a11y-avancado.spec.ts --project=chromium --project=mobile-chrome --project=mobile-safari --project=mobile-320 --project=mobile-412
        env:
          DEVICE_NAME: ${{ matrix.device }}
      - name: Upload Accessibility Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-evidence-${{ matrix.device }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Visual Tests
        run: bunx playwright test tests/e2e/visual-regression-consolidated.spec.ts
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 30
