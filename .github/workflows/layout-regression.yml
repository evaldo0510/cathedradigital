name: Layout Governance & Visual Regression

on:
  pull_request:
    branches: [main, master]

jobs:
  audit:
    name: Layout Governance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Run Layout Audit
        run: bun run scripts/audit-layout-governance.ts

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Visual Tests
        run: bunx playwright test tests/e2e/visual-regression-consolidated.spec.ts
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 30
      - name: Summary to PR
        if: failure()
        run: |
          echo "### ❌ Visual Regression Failed" >> $GITHUB_STEP_SUMMARY
          echo "Layout shifts detected in the following pages. Check the [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for diffs." >> $GITHUB_STEP_SUMMARY
          echo "| Page | Breakpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          # This would be populated by parsing test-results.json in a real workflow
