name: Layout Governance & Visual Regression

on:
  pull_request:
    branches: [main, master]

jobs:
  smoke-reduced-motion:
    name: Smoke Test - Reduced Motion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Reduced Motion Smoke Test
        run: bunx playwright test tests/e2e/preferencia-reducao-movimento.spec.ts --project=chromium

  audit:
    name: Layout Governance Audit
    needs: smoke-reduced-motion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Run Layout Audit
        run: bun script/audit-layout-governance.ts

  accessibility:
    name: Accessibility & UX Audit
    needs: smoke-reduced-motion
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [ 'iPhone SE', 'iPhone 14 Pro Max', 'Pixel 7', 'mobile-320', 'mobile-412', 'Desktop Chrome', 'Desktop Safari' ]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Run Accessibility & Reduced Motion Tests
        run: |
          PROJECTS="--project=chromium --project=mobile-chrome --project=mobile-safari --project=mobile-320 --project=mobile-412"
          if [[ "${{ matrix.device }}" == "Desktop Safari" ]]; then PROJECTS="--project=webkit"; fi
          bunx playwright test tests/e2e/catecismo-a11y-avancado.spec.ts tests/e2e/bottom-nav-reduced-motion.spec.ts tests/e2e/preferencia-reducao-movimento.spec.ts $PROJECTS
        env:
          DEVICE_NAME: ${{ matrix.device }}
      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.device }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  visual:
    name: Visual Regression
    needs: smoke-reduced-motion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Visual Tests
        run: bunx playwright test tests/e2e/visual-regression-consolidated.spec.ts
      - name: Upload Visual Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            test-results/
            playwright-report/
          retention-days: 30
