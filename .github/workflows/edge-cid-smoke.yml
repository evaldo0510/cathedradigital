name: edge-cid-smoke

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/functions/tests/**'
      - 'scripts/generate-cid-compliance-report.ts'
      - 'scripts/persist-cid-snapshot.ts'
      - 'docs/EDGE-FUNCTIONS-COMPLIANCE-MATRIX.md'
      - '.github/workflows/edge-cid-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'docs/EDGE-FUNCTIONS-COMPLIANCE-MATRIX.md'
  workflow_dispatch:

concurrency:
  group: edge-cid-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: correlation_id + CORS smoke (47 Edge Functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Guard — secrets configurados
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY não configurados no repositório."
            exit 1
          fi

      - name: Smoke — CORS + eco/geração de CID (47 funções)
        run: deno test -A supabase/functions/tests/cid_cors_smoke_test.ts

      - name: E2E — CID em respostas de erro por categoria
        run: deno test -A supabase/functions/tests/cid_error_scenarios_test.ts

      - name: E2E — variações de header x-correlation-id (missing/empty/dup/extreme)
        run: deno test -A supabase/functions/tests/cid_header_variations_test.ts

      - name: E2E — concorrência (múltiplos CIDs simultâneos sem mistura)
        run: deno test -A supabase/functions/tests/cid_concurrency_test.ts

      - name: A2/Zod strict — envelope padronizado nas funções auditadas
        run: deno test -A supabase/functions/tests/cid_zod_envelope_test.ts

      - name: Relatório de conformidade CID (matriz + contagem + falhas)
        if: always()
        id: report
        run: deno run -A scripts/generate-cid-compliance-report.ts

      - name: Persistir snapshot na tabela cid_compliance_snapshots
        if: always() && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: deno run -A scripts/persist-cid-snapshot.ts

      - name: Upload artefato — cid-compliance-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cid-compliance-report
          path: artifacts/cid-compliance-report.*
          if-no-files-found: warn
          retention-days: 30

      - name: Comentar resumo no PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'artifacts/cid-compliance-summary.md';
            if (!fs.existsSync(path)) {
              core.warning('cid-compliance-summary.md ausente — pulando comentário');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const jsonPath = 'artifacts/cid-compliance-report.json';
            let alert = '';
            if (fs.existsSync(jsonPath)) {
              const doc = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
              const ausente = doc.meta?.cid_counts?.ausente ?? 0;
              const failing = (doc.rows || []).filter(r => (r.failedSteps||[]).length > 0);
              if (ausente > 0 || failing.length > 0) {
                alert = `> 🚨 **Alerta CID**: ${ausente} função(ões) sem CID · ${failing.length} com etapas em falha.\n\n`;
              }
            }
            const marker = '<!-- cid-compliance-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));
            const finalBody = `${marker}\n${alert}${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: finalBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: finalBody });
            }

      - name: Gate estrito — falha se CID ausente ou etapas em falha
        if: always()
        run: deno run -A scripts/generate-cid-compliance-report.ts --strict

  governance-gate:
    name: governance_audit_log — CID nas 7 funções auditadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: smoke
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Guard — SERVICE_ROLE opcional (skip se ausente)
        id: guard
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY ausente — gate de governance será IGNORADO."
            echo "has_service_role=false" >> $GITHUB_OUTPUT
          else
            echo "has_service_role=true" >> $GITHUB_OUTPUT
          fi

      - name: Rodar gate reformulado (7 funções auditadas)
        if: steps.guard.outputs.has_service_role == 'true'
        run: deno test -A supabase/functions/tests/cid_governance_gate_test.ts
