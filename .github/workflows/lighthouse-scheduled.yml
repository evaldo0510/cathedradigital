name: Lighthouse — Scheduled (staging/prod)

on:
  schedule:
    # 1º dia de cada mês, 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente (staging|production)'
        required: true
        default: 'production'
        type: choice
        options: [staging, production]
      routes:
        description: 'Rotas CSV (ex.: /profile,/atrium,/pricing)'
        required: false
        default: '/profile'

jobs:
  lighthouse:
    name: LHCI monthly (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      LH_ENV: ${{ inputs.environment || 'production' }}
      LH_BASE_URL: ${{ (inputs.environment == 'staging' && vars.LH_STAGING_URL) || vars.LH_PRODUCTION_URL }}
      LH_ROUTES: ${{ inputs.routes || vars.LH_SCHEDULED_ROUTES || '/profile' }}
      LH_ALLOW_UNAUTH: ${{ (secrets.TEST_USER_EMAIL == '' || secrets.TEST_USER_PASSWORD == '') && '1' || '' }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install
        run: bun install --frozen-lockfile
        env: { HUSKY: 0 }

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Validate base URL
        run: |
          if [ -z "$LH_BASE_URL" ]; then
            echo "::error::LH_BASE_URL vazio. Configure vars LH_STAGING_URL / LH_PRODUCTION_URL."
            exit 1
          fi
          echo "Rodando contra $LH_BASE_URL ($LH_ENV) — rotas: $LH_ROUTES"

      - name: Run Lighthouse
        id: lh
        run: node scripts/lighthouse-run.mjs

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-scheduled-${{ env.LH_ENV }}
          path: .lighthouseci/
          retention-days: 90

      - name: Open issue on budget violation
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = `Lighthouse mensal falhou em **${process.env.LH_ENV}** contra ${process.env.LH_BASE_URL}.\n\nRotas: \`${process.env.LH_ROUTES}\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const s = JSON.parse(fs.readFileSync('.lighthouseci/summary.json', 'utf8'));
              body += `\n\n### Resumo\n\n| Device | URL | Perf | LCP | CLS | TBT |\n|---|---|---:|---:|---:|---:|\n` +
                s.runs.map(r => `| ${r.device} | ${r.url} | ${(r.performance*100).toFixed(0)} | ${r.lcp.toFixed(0)}ms | ${r.cls.toFixed(3)} | ${r.tbt.toFixed(0)}ms |`).join('\n');
            } catch {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[Lighthouse] Budget violation — ${process.env.LH_ENV} — ${new Date().toISOString().slice(0,10)}`,
              labels: ['performance', 'lighthouse', 'automated'],
              body,
            });
