name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Run CI Tests
        run: bun run test:ci
      - name: Run E2E Tests
        run: |
          npx playwright install --with-deps chromium
          bun run test:e2e tests/e2e/stability.spec.ts
