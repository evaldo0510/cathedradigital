name: Design System & Performance Governance

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  governance:
    name: 🛡️ Premium Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install
        
      - name: 🤖 Automated Icon Fix (Registry)
        run: |
          bun run scripts/fix-icons.js || echo "Some icons could not be fixed automatically"
          
      - name: ⚡ Performance Budget Audit (Lighthouse CI)
        run: |
          # Fails if LCP, TBT or CLS exceed defined budgets
          npx playwright install chromium
          npm run test:performance
          
      - name: 📱 Above the Fold Visual Audit
        run: |
          # Multi-viewport visual regression and numerical content top check
          npm run test:visual
          
      - name: 🏗️ Layout Constraint Check
        run: |
          # Verify header and navigation heights in CSS
          grep -q "--header-height: 40px" src/index.css || (echo "Header height exceeded premium limit!" && exit 1)
          grep -q "--bottom-nav-height: 52px" src/index.css || (echo "Bottom nav height exceeded premium limit!" && exit 1)
          
      - name: 🎨 Design System Compliance Audit
        run: |
          # Enforce design token usage
          node scripts/design-system-audit.js
          
      - name: 📈 Generate PR Summary
        if: github.event_name == 'pull_request'
        run: |
          bun run scripts/generate-pr-comment.ts > reports/pr-comment.md
          
      - name: 📊 Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-quality-reports
          path: |
            reports/
            src/components/cathedra/reports/
            test-results/

