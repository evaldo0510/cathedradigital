name: Design System & Icon Governance

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  governance:
    name: 🛡️ Design System & Icon Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install
        
      - name: 🤖 Automated Icon Fix (Registry)
        run: |
          # Detect and fix direct lucide-react imports using the standardized registry
          bun run scripts/fix-icons.js || echo "Some icons could not be fixed automatically"
          
      - name: Layout and Performance Audit
        run: |
          npm run test:performance
          npm run test:visual
          
      - name: Verify Above the Fold Height
        run: |
          # Custom check for header height in built CSS
          grep -q "--header-height: 40px" src/index.css || (echo "Header height exceeded premium limit!" && exit 1)
          grep -q "--bottom-nav-height: 52px" src/index.css || (echo "Bottom nav height exceeded premium limit!" && exit 1)
          
      - name: 🔍 Icon Standard Audit
        run: |
          # Ensure no direct imports remain and icons use standard 20px / 1.2 stroke
          # We use the existing test file which handles these checks
          bun run test src/components/__tests__/icon-audit.test.tsx
          
      - name: 🎨 Design System Compliance Audit
        run: |
          # Measure layout, card, theme and token compliance per page
          # This script now enforces thresholds and fails the PR
          node scripts/design-system-audit.js
          
      - name: 📈 Update README Compliance Badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run scripts/update-readme-badge.ts
        
      - name: 📊 Upload Compliance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-system-reports
          path: |
            src/components/cathedra/reports/COMPLIANCE_REPORT.md
            reports/compliance-history.json

      - name: 🚀 Commit Badge Updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update compliance badge [skip ci]"
          git push
