name: saints-editorial-integrity

on:
  pull_request:
    paths:
      - 'supabase/seeds/saints*'
      - 'src/data/saints*'
      - 'scripts/saints-editorial-integrity.ts'
      - '.github/workflows/saints-editorial.yml'
  workflow_dispatch:

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Run editorial integrity guardrail
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun scripts/saints-editorial-integrity.ts
