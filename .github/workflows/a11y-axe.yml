name: A11y · Axe (color-contrast + core)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'tailwind.config.*'
      - '.github/workflows/a11y-axe.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build (Vite)
        run: bun run build

      - name: Serve preview
        run: |
          bunx --bun vite preview --port 4173 --host 127.0.0.1 &
          echo $! > .preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then
              echo "preview ready"; exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"; exit 1

      - name: Setup Python + Playwright
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run axe (color-contrast + core rules) on /, /atrium, /jornadas
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p reports/a11y
          python scripts/a11y-axe-report.py
          echo "--- summary ---"
          cat reports/a11y/summary.txt || true

      - name: Fail build on new critical/serious violations
        run: |
          # Guardrail: color-contrast + critical/serious combined
          fail=$(jq '[.[] | select(.impact=="serious" or .impact=="critical")] | length' reports/a11y/violations.json)
          echo "Serious+critical: $fail"
          if [ "$fail" -gt 0 ]; then
            echo "::error::A11y guardrail failed ($fail serious/critical violations). See artifact 'a11y-report'."
            exit 1
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: reports/a11y/
          retention-days: 14

      - name: Stop preview
        if: always()
        run: |
          if [ -f .preview.pid ]; then kill "$(cat .preview.pid)" || true; fi
