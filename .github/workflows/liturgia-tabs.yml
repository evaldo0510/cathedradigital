name: Liturgia Tabs Guard

on:
  pull_request:
    paths:
      - 'src/components/cathedra/LiturgiaPage.tsx'
      - 'src/components/cathedra/TabUtils.tsx'
      - 'src/components/ui/tabs.tsx'
      - 'src/components/ui/button.tsx'
      - 'src/index.css'
      - 'tests/e2e/liturgia-tabs-*.spec.ts'
      - '.github/workflows/liturgia-tabs.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/cathedra/LiturgiaPage.tsx'
      - 'tests/e2e/liturgia-tabs-*.spec.ts'

jobs:
  liturgia-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit

      - name: Run Liturgia tab suite (visual + a11y + orientation + keyboard + dark + toggle + focus-ring)
        env:
          CI: 'true'
        run: |
          bunx playwright test \
            tests/e2e/liturgia-tabs-mobile.spec.ts \
            tests/e2e/liturgia-tabs-tablet.spec.ts \
            tests/e2e/liturgia-tabs-desktop.spec.ts \
            tests/e2e/liturgia-tabs-desktop-dark.spec.ts \
            tests/e2e/liturgia-tabs-keyboard.spec.ts \
            tests/e2e/liturgia-tabs-visual.spec.ts \
            tests/e2e/liturgia-tabs-portrait.spec.ts \
            tests/e2e/liturgia-tabs-landscape.spec.ts \
            tests/e2e/liturgia-tabs-a11y.spec.ts \
            tests/e2e/liturgia-tabs-toggle.spec.ts \
            tests/e2e/liturgia-tabs-focus-ring.spec.ts \
            tests/e2e/liturgia-tabs-aria.spec.ts \
            tests/e2e/liturgia-tabs-dark-responsive.spec.ts \
            tests/e2e/liturgia-tabs-panel-content.spec.ts \
            tests/e2e/liturgia-tabs-axe-dark-responsive.spec.ts \
            tests/e2e/liturgia-tabs-reduced-motion.spec.ts \
            tests/e2e/liturgia-tabs-shift-tab.spec.ts \
            tests/e2e/liturgia-tabs-visual-dark-responsive.spec.ts \
            tests/e2e/liturgia-tabs-theme-toggle-dynamic.spec.ts \
            tests/e2e/liturgia-tabs-mobile-tap.spec.ts \
            tests/e2e/liturgia-tabs-visual-dark-states.spec.ts \
            tests/e2e/liturgia-tabs-forced-colors.spec.ts \
            tests/e2e/liturgia-tabs-aria-linkage.spec.ts \
            tests/e2e/liturgia-tabs-axe-theme-dynamic.spec.ts \
            tests/e2e/liturgia-tabs-axe-tab-switch-dynamic.spec.ts \
            --project=chromium --reporter=list,html

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liturgia-tabs-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload visual diffs & screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: liturgia-tabs-visual-diffs
          path: |
            test-results/**/*-actual.png
            test-results/**/*-expected.png
            test-results/**/*-diff.png
            test-results/**/*.png
            test-results/**/trace.zip
            test-results/**/video.webm
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload full test-results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: liturgia-tabs-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary — how to inspect visual diffs
        if: failure()
        run: |
          {
            echo "### 🔍 Visual regression falhou"
            echo ""
            echo "Baixe o artefato **liturgia-tabs-visual-diffs** — contém:"
            echo "- \`*-actual.png\` → screenshot capturado neste run"
            echo "- \`*-expected.png\` → baseline commitado"
            echo "- \`*-diff.png\` → diff pixel-a-pixel (contraste/estilo)"
            echo ""
            echo "Traces em \`trace.zip\` abrem em https://trace.playwright.dev"
            echo ""
            echo "Atualizar baseline (após revisão):"
            echo '```bash'
            echo "bunx playwright test tests/e2e/liturgia-tabs-visual.spec.ts --update-snapshots"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
