name: SEO and Knowledge Certification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  seo-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install
        
      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps chromium
        
      - name: Run SEO Certification Suite
        run: bun run test:seo-ci
        env:
          CI: true
          
      - name: Upload SEO Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-reports
          path: |
            dist/seo/
            test-results/

      - name: PR Summary Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/seo/routes-report.json'; // Assumindo que o script gera JSON também
            let summary = "### 🛡️ SEO Certification Report\n\n";
            
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              summary += `✅ Rotas Mapeadas: ${data.total}\n`;
              summary += `❌ Erros: ${data.errors}\n`;
              summary += `⚠️ Avisos: ${data.warnings}\n\n`;
              summary += "[Baixe o relatório completo nos artefatos do build]";
            } else {
              summary += "⚠️ Relatório de SEO não encontrado no workspace.";
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

