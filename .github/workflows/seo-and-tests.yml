name: SEO & Tests (PR Gate)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seo-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://gpwrpmoniglarqwfyryp.supabase.co' }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://gpwrpmoniglarqwfyryp.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  vitest:
    name: Vitest (unit + integridade editorial)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run Vitest
        run: bunx vitest run --reporter=default

  seo-assets:
    name: Sitemap · robots · SEO checklist · indexing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Gerar sitemap.xml + robots.txt
        run: bun run scripts/generate-sitemap.ts

      - name: Auditar relações hardcoded no Glossário e adapters
        run: bun run scripts/audit-glossary-hardcoded.ts

      - name: Auditar links do rodapé (footer-links.ts × App.tsx × routeMeta.ts)
        run: bun run scripts/audit-footer-links.ts

      - name: Rodar SEO checklist
        run: bun run scripts/seo-checklist.ts

      - name: Checklist de indexação do Glossário
        run: bun run scripts/glossary-indexing-checklist.ts

      - name: Falhar se sitemap/robots ficaram fora de sync
        run: |
          if ! git diff --quiet -- public/sitemap.xml public/robots.txt; then
            echo "::error::sitemap.xml/robots.txt desatualizados. Rode: bun run scripts/generate-sitemap.ts"
            git --no-pager diff -- public/sitemap.xml public/robots.txt
            exit 1
          fi

      - name: Publicar relatórios SEO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-reports
          path: |
            public/sitemap.xml
            public/robots.txt
            public/seo-checklist-report.json
            public/glossary-indexing-report.json
          if-no-files-found: warn
          retention-days: 14

  nexus-perf:
    name: Nexus perf guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Guardrail de performance dos adapters do Nexus
        run: bun scripts/nexus-perf-guardrail.ts

  reader-template:
    name: Reader Template Master · audit + guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Guardrail — bloqueia imports proibidos
        run: bun scripts/reader-guardrail.ts
      - name: Auditoria — score por módulo (falha se blocking < alvo)
        run: bun scripts/reader-template-audit.ts --report
      - name: Publicar relatório de aderência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-template-report
          path: reports/reader-template.json
          if-no-files-found: warn
          retention-days: 30

  playwright:
    name: Playwright E2E (SEO Glossário)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Instalar Chromium (Playwright)
        run: bunx playwright install --with-deps chromium
      - name: Rodar E2E SEO Glossário
        run: bunx playwright test tests/e2e/glossary-seo.spec.ts tests/e2e/glossary-nexus-sections.spec.ts --project=chromium
        env:
          CI: 'true'
      - name: Publicar relatório Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  publish-gate:
    name: Publish Gate · prebuild + Playwright full suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Prebuild (sitemap + SEO gates + guard /planos)
        run: bun run prebuild

      - name: Build (garante publish success)
        run: bun run build

      - name: Instalar navegador Playwright (${{ matrix.project }})
        run: bunx playwright install --with-deps ${{ matrix.project }}

      - name: Subir preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080 >/dev/null; then
              echo "preview up"; exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"; exit 1

      - name: Playwright full suite (${{ matrix.project }})
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: bunx playwright test --project=${{ matrix.project }}

      - name: Capturar diagnóstico /pricing (HTML + JSON-LD) em falha
        if: failure()
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: bun run scripts/capture-pricing-diagnostics.ts || true

      - name: Publicar diagnóstico /pricing (${{ matrix.project }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-diagnostics-${{ matrix.project }}
          path: diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar relatório Playwright (${{ matrix.project }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-publish-gate-${{ matrix.project }}
          path: playwright-report
          retention-days: 14


  smoke-console:
    name: Smoke E2E · rotas sem console.error / exception
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Instalar Chromium (Playwright)
        run: bunx playwright install --with-deps chromium
      - name: Rodar smoke de rotas (falha em qualquer console.error)
        run: bunx playwright test tests/e2e/smoke-routes-clean-console.spec.ts --project=chromium
        env:
          CI: 'true'
      - name: Publicar relatório do smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report
          retention-days: 14

  prod-seo-http:
    name: Prod SEO HTTP · /planos redirect + /pricing headers + sitemap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Roda em push para main (pós-merge = pós-deploy Vercel) e sob demanda.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://www.cathedradigital.com.br' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Instalar Chromium (Playwright)
        run: bunx playwright install --with-deps chromium

      - name: Aguardar deploy Vercel propagar (30s)
        run: sleep 30

      - name: HTTP checks contra produção (redirect + headers)
        run: |
          bunx playwright test \
            tests/e2e/planos-http-production.spec.ts \
            --project=chromium
        env:
          CI: 'true'

      - name: Curl sanity check · sitemap + robots + /planos
        run: |
          set -e
          echo "→ robots.txt"
          curl -sSfI "$PROD_BASE_URL/robots.txt" | grep -i 'content-type'
          curl -sSf  "$PROD_BASE_URL/robots.txt" | grep -q '^Disallow: /planos$' \
            || (echo "::error::robots.txt sem Disallow: /planos" && exit 1)

          echo "→ sitemap.xml (não pode conter /planos)"
          if curl -sSf "$PROD_BASE_URL/sitemap.xml" | grep -q '/planos<'; then
            echo "::error::sitemap.xml expõe /planos"
            exit 1
          fi

          echo "→ /planos deve redirect 301/308 para /pricing"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$PROD_BASE_URL/planos")
          loc=$(curl -sSI "$PROD_BASE_URL/planos" | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r')
          echo "status=$code location=$loc"
          [[ "$code" =~ ^(301|308)$ ]] || (echo "::error::/planos status inesperado: $code" && exit 1)
          [[ "$loc" == *"/pricing"* ]] || (echo "::error::/planos Location não aponta para /pricing: $loc" && exit 1)

          echo "→ /pricing deve responder 200"
          curl -sSfI "$PROD_BASE_URL/pricing" >/dev/null

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prod-seo-http
          path: playwright-report
          retention-days: 14

