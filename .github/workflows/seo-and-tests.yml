name: SEO & Performance Quality Gate
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        
      - name: Install dependencies
        run: bun install
        
      - name: Build and Test
        run: bun run prebuild
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Upload SEO & Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-and-perf-reports
          path: |
            dist/seo/
            playwright-report/
            test-results/
            reports/
          retention-days: 7

      - name: PR Summary Table
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f dist/seo/routes-report.json ]; then
            echo "### 📊 Resumo de SEO & Certificação" >> $GITHUB_STEP_SUMMARY
            echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            cat dist/seo/routes-report.json | jq -r '"| Erros | \(.errors) |", "| Avisos | \(.warnings) |", "| Total Rotas | \(.total) |"' >> $GITHUB_STEP_SUMMARY
          fi
