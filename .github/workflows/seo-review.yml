name: SEO & Social Review

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  seo-audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run SEO & Schema Audit
      run: npx playwright test tests/e2e/home-seo.spec.ts
      env:
        CI: true

    - name: Upload SEO Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: seo-audit-report
        path: test-results/seo-audit-report.html
        retention-days: 30
