name: SEO & Social Review

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  pull-requests: write

jobs:
  seo-audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Generate Sitemap & Robots
      run: bun run generate:seo

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run SEO & Schema Audit
      run: npx playwright test tests/e2e/home-seo.spec.ts tests/e2e/internal-seo.spec.ts tests/e2e/sitemap-delivery.spec.ts tests/e2e/link-audit.spec.ts
      env:
        CI: true

    - name: Generate SEO Comment
      if: always() && github.event_name == 'pull_request'
      run: bun run scripts/generate-seo-comment.ts

    - name: Post SEO Comment to PR
      if: always() && github.event_name == 'pull_request'
      uses: thollander/actions-comment-pull-request@v2
      with:
        filePath: seo-comment.md
        comment_tag: seo-audit-summary

    - name: Upload SEO Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: seo-audit-reports
        path: |
          test-results/*.html
          test-results/*.json
          public/sitemap.xml
          public/robots.txt
        retention-days: 30


