name: axe color-contrast regression

# Bloqueia PRs que reintroduzam violações `color-contrast` (WCAG 2.1 AA)
# em rotas já saneadas. Escopo restrito à regra color-contrast para não
# se sobrepor aos workflows a11y/contrast existentes.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tailwind.config.ts'
      - 'index.html'
      - 'tests/e2e/axe-color-contrast-regression.spec.ts'
      - '.github/workflows/axe-color-contrast.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  axe-color-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bunx vite preview --port 8080 --strictPort &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/ > /dev/null; then echo "preview ready"; break; fi
            sleep 1
          done

      - name: Run axe color-contrast regression
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          CI: 'true'
        run: |
          bunx playwright test tests/e2e/axe-color-contrast-regression.spec.ts \
            --reporter=list,html

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then kill "$(cat /tmp/preview.pid)" || true; fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-color-contrast-report
          path: playwright-report
          retention-days: 14
