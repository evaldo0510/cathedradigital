name: Mobile CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Mobile E2E Tests (Matrix)
        run: |
          # Simulação de matriz de dispositivos
          # No futuro: npx playwright test --project=iPhone-12 --project=Pixel-5
          bun test src/test/MobileNavigation.test.tsx src/test/BottomNavRegression.test.tsx
        env:
          TEST_VIEWPORTS: "320x568,375x667,414x896,768x1024"
          CI: true

      - name: Upload Test Reports & Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
            screenshots/
            logs/

      - name: Notify CI Failure
        if: failure()
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "text": "🚨 *Cathedra Critical: Mobile Regression Detected*",
            "attachments": [
              {
                "color": "#D42020",
                "title": "Mobile Navigation Failure | Branch: ${GITHUB_REF_NAME}",
                "title_link": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
                "fields": [
                  { "title": "Commit", "value": "${GITHUB_SHA:0:7}", "short": true },
                  { "title": "Action ID", "value": "${GITHUB_RUN_ID}", "short": true },
                  { "title": "Evidence Artifacts", "value": "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts|Download Screenshots & Logs>", "short": false },
                  { "title": "Status", "value": "FAILURE", "short": true },
                  { "title": "Security", "value": "PII Redacted", "short": true }
                ],

                "footer": "AD MAIOREM DEI GLORIAM — PII Protected Stability Guard",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )

          # Note: secrets.CI_NOTIFICATION_WEBHOOK must be set in repository settings
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.CI_NOTIFICATION_WEBHOOK }} || echo "Webhook not configured"






