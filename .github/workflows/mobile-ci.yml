name: Mobile CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Mobile E2E Tests (Matrix)
        run: |
          # Simulação de matriz de dispositivos
          # No futuro: npx playwright test --project=iPhone-12 --project=Pixel-5
          bun test src/test/MobileNavigation.test.tsx src/test/BottomNavRegression.test.tsx
        env:
          TEST_VIEWPORTS: "320x568,375x667,414x896,768x1024"
          CI: true

      - name: Upload Test Reports & Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
            screenshots/
            logs/

      - name: Notify CI Failure
        if: failure()
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "text": "🚨 *Cathedra Mobile E2E Failure*",
            "attachments": [
              {
                "color": "#FF0000",
                "fields": [
                  { "title": "Job", "value": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}", "short": false },
                  { "title": "Ref", "value": "${GITHUB_REF}", "short": true },
                  { "title": "Environment", "value": "CI/CD Pipeline", "short": true }
                ],
                "footer": "AD MAIOREM DEI GLORIAM — Security & Stability Gate"
              }
            ]
          }
          EOF
          )
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.CI_NOTIFICATION_WEBHOOK }}




