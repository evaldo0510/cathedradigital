name: Mobile CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      device_matrix:
        description: 'Projetos Playwright (ex: mobile-chrome,mobile-safari)'
        default: 'mobile-chrome,mobile-safari'
        required: true
      only_failed:
        description: 'Reexecutar apenas falhas da última run?'
        type: boolean
        default: false

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Playwright E2E Tests (Mobile Matrix)
        run: |
          PROJECTS="${{ github.event.inputs.device_matrix || 'mobile-chrome,mobile-safari' }}"
          ONLY_FAILED="${{ github.event.inputs.only_failed || 'false' }}"
          
          CMD="npx playwright test tests/e2e/swipe-precision.spec.ts"
          
          if [ "$ONLY_FAILED" = "true" ]; then
            CMD="$CMD --last-failed"
          else
            IFS=',' read -ra ADDR <<< "$PROJECTS"
            for i in "${ADDR[@]}"; do
              CMD="$CMD --project=$i"
            done
          fi
          
          $CMD --reporter=list,json,html
        env:
          VITE_SWIPE_THRESHOLD: 80
          VITE_SWIPE_RATIO: 2.5
          CI: true
          HEADLESS: true

      - name: Generate Evidence Manifest & Validate
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          if (fs.existsSync('playwright-report/results.json')) {
            const results = JSON.parse(fs.readFileSync('playwright-report/results.json', 'utf8'));
            const manifest = [];
            let allEvidencesExist = true;

            results.suites.forEach(suite => {
              suite.specs.forEach(spec => {
                spec.tests.forEach(test => {
                  const evidences = test.results.flatMap(r => r.attachments || []);
                  
                  if (test.status === 'failed' || test.status === 'unexpected') {
                    const hasTrace = evidences.some(a => a.name === 'trace');
                    if (!hasTrace) {
                      console.error('❌ Trace ausente para:', spec.title);
                      allEvidencesExist = false;
                    }
                  }

                  manifest.push({
                    title: spec.title,
                    project: test.projectName,
                    status: test.status,
                    file: spec.file,
                    line: spec.line,
                    evidence: evidences
                  });
                });
              });
            });
            
            fs.writeFileSync('playwright-report/evidence-manifest.json', JSON.stringify(manifest, null, 2));
            if (!allEvidencesExist) process.exit(1);
          }
          "

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: ${{ vars.RETENTION_DAYS_HTML || 7 }}
          if-no-files-found: error

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: ${{ vars.RETENTION_DAYS_EVIDENCE || 3 }}
          if-no-files-found: error

      - name: PR Commentary on Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run_id = context.runId;
            const artifact_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}/artifacts`;
            
            let summary = "### 🚨 Mobile E2E Failure Detected\n\n";
            summary += "#### 📱 Resumo por Dispositivo\n\n";
            
            try {
              if (fs.existsSync('playwright-report/evidence-manifest.json')) {
                const manifest = JSON.parse(fs.readFileSync('playwright-report/evidence-manifest.json', 'utf8'));
                const grouped = manifest.reduce((acc, item) => {
                  if (item.status === 'failed' || item.status === 'unexpected') {
                    if (!acc[item.project]) acc[item.project] = [];
                    acc[item.project].push(item);
                  }
                  return acc;
                }, {});

                for (const [device, tests] of Object.entries(grouped)) {
                  summary += `**${device}**\n\n`;
                  summary += "| Teste | Status | Evidência |\n";
                  summary += "| :--- | :--- | :--- |\n";
                  tests.forEach(t => {
                    summary += `| ${t.title} | ❌ Falhou | [Ver Trace/HTML](${artifact_url}) |\n`;
                  });
                  summary += "\n";
                }
              }
            } catch (e) {
              summary += `\n*Erro ao gerar resumo: ${e.message}*\n`;
            }
            
            summary += `\n- **Reexecutar falhas:** [Re-run failed jobs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id})`;
            summary += `\n- **Local:** \`npm run test:e2e:sync-failed\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })

      - name: Notify CI Failure
        if: failure()
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "text": "🚨 *Cathedra Critical: Mobile Regression Detected*",
            "attachments": [
              {
                "color": "#D42020",
                "title": "Mobile Navigation Failure | Branch: ${GITHUB_REF_NAME}",
                "title_link": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
                "fields": [
                  { "title": "Commit", "value": "${GITHUB_SHA:0:7}", "short": true },
                  { "title": "Evidence Artifacts", "value": "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts|Download Screenshots & Logs>", "short": false }
                ],
                "footer": "AD MAIOREM DEI GLORIAM",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.CI_NOTIFICATION_WEBHOOK }} || echo "Webhook not configured"
