name: Mobile CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Mobile E2E Tests (Matrix)
        run: |
          # Em um ambiente real com Playwright:
          # npx playwright test --project=mobile
          bun test src/test/MobileNavigation.test.tsx
        env:
          TEST_VIEWPORTS: "320x568,375x667,414x896,768x1024"
          CI: true

      - name: Upload Test Reports & Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
            screenshots/

