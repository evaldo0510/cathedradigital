name: Mobile CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      device_matrix:
        description: 'Projetos Playwright (ex: mobile-chrome,mobile-safari)'
        default: 'mobile-chrome,mobile-safari'
        required: true
      only_failed:
        description: 'Reexecutar apenas falhas da última run?'
        type: boolean
        default: false

env:
  # Retenção padrão (dias)
  RETENTION_HTML: ${{ vars.RETENTION_DAYS_HTML || 7 }}
  RETENTION_SCREENSHOTS: ${{ vars.RETENTION_DAYS_SCREENSHOTS || 3 }}
  RETENTION_VIDEOS: ${{ vars.RETENTION_DAYS_VIDEOS || 3 }}
  RETENTION_TRACES: ${{ vars.RETENTION_DAYS_TRACES || 3 }}
  # Limites de tamanho (MB aproximado via upload-artifact logic ou apenas documentação)
  # Nota: upload-artifact não tem um 'max-size' nativo por arquivo, mas podemos documentar.

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Playwright E2E Tests (Mobile Matrix)
        run: |
          PROJECTS="${{ github.event.inputs.device_matrix || 'mobile-chrome,mobile-safari' }}"
          ONLY_FAILED="${{ github.event.inputs.only_failed || 'false' }}"
          
          CMD="npx playwright test tests/e2e/swipe-precision.spec.ts"
          
          if [ "$ONLY_FAILED" = "true" ]; then
            CMD="$CMD --last-failed"
          else
            IFS=',' read -ra ADDR <<< "$PROJECTS"
            for i in "${ADDR[@]}"; do
              CMD="$CMD --project=$i"
            done
          fi
          
          $CMD --reporter=list,json,html
        env:
          VITE_SWIPE_THRESHOLD: 80
          VITE_SWIPE_RATIO: 2.5
          CI: true
          HEADLESS: true

      - name: Generate Evidence Manifest & Validate
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          if (fs.existsSync('playwright-report/results.json')) {
            const results = JSON.parse(fs.readFileSync('playwright-report/results.json', 'utf8'));
            const manifest = [];
            let validationErrors = [];

            results.suites.forEach(suite => {
              suite.specs.forEach(spec => {
                spec.tests.forEach(test => {
                  const result = test.results[0] || {};
                  const attachments = result.attachments || [];
                  
                  // Mapeia todas as evidências
                  const evidenceMap = {
                    trace: attachments.find(a => a.name === 'trace')?.path,
                    screenshot: attachments.find(a => a.name === 'screenshot')?.path,
                    video: attachments.find(a => a.name === 'video')?.path
                  };

                  if (test.status === 'failed' || test.status === 'unexpected') {
                    if (!test.projectName) validationErrors.push('Missing projectName for ' + spec.title);
                    if (!evidenceMap.trace) validationErrors.push('Missing trace for failed test: ' + spec.title);
                    
                    // Verifica se os arquivos físicos existem na pasta de relatório
                    Object.entries(evidenceMap).forEach(([type, relPath]) => {
                      if (relPath) {
                        const fullPath = path.join('playwright-report', relPath);
                        if (!fs.existsSync(fullPath)) {
                          validationErrors.push('Evidence file missing: ' + type + ' at ' + fullPath);
                        }
                      }
                    });
                  }

                  manifest.push({
                    title: spec.title,
                    project: test.projectName,
                    status: test.status,
                    file: spec.file,
                    line: spec.line,
                    evidences: evidenceMap
                  });
                });
              });
            });
            
            if (validationErrors.length > 0) {
              console.error('❌ Manifest Validation Failed:\n' + validationErrors.join('\n'));
              process.exit(1);
            }
            
            fs.writeFileSync('playwright-report/evidence-manifest.json', JSON.stringify(manifest, null, 2));
            console.log('✅ Manifest generated and validated with ' + manifest.length + ' entries.');
          }
          "

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: ${{ env.RETENTION_HTML }}
          if-no-files-found: error

      - name: PR Commentary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run_id = context.runId;
            const artifact_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}/artifacts`;
            
            let summary = "### 📊 Mobile E2E Test Summary\n\n";
            
            try {
              if (fs.existsSync('playwright-report/evidence-manifest.json')) {
                const manifest = JSON.parse(fs.readFileSync('playwright-report/evidence-manifest.json', 'utf8'));
                const failed = manifest.filter(t => t.status === 'failed' || t.status === 'unexpected');
                const passed = manifest.filter(t => t.status === 'passed');
                
                summary += `**Resumo Geral:** ✅ ${passed.length} passados | ❌ ${failed.length} falhas\n\n`;
                
                if (failed.length > 0) {
                  const grouped = failed.reduce((acc, item) => {
                    if (!acc[item.project]) acc[item.project] = [];
                    acc[item.project].push(item);
                    return acc;
                  }, {});

                  for (const [device, tests] of Object.entries(grouped)) {
                    summary += `<details open><summary><b>📱 ${device} (${tests.length} falhas)</b></summary>\n\n`;
                    summary += "| Teste | Status | Evidências (Download Artefato) |\n";
                    summary += "| :--- | :--- | :--- |\n";
                    tests.forEach(t => {
                      const evList = [];
                      if (t.evidences.trace) evList.push("Trace");
                      if (t.evidences.screenshot) evList.push("Screenshot");
                      if (t.evidences.video) evList.push("Video");
                      summary += `| ${t.title} | ❌ Failed | ${evList.join(', ') || 'Nenhuma'} |\n`;
                    });
                    summary += "\n</details>\n";
                  }
                } else {
                  summary += "🎉 Todos os testes mobile passaram!\n";
                }
              }
            } catch (e) {
              summary += `\n*Erro ao gerar resumo detalhado: ${e.message}*\n`;
            }
            
            summary += `\n---\n**Ações:** [Ver Workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}) | [Download Artefatos](${artifact_url})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })

