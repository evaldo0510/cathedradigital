name: E2E Desktop (focus + back/forward)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/components/cathedra/Rosary.tsx'
      - 'src/components/cathedra/GlossaryPage.tsx'
      - 'src/lib/rosaryReturnContext.ts'
      - 'tests/e2e/**rosary**'
      - 'tests/e2e/**glossary**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-desktop.yml'
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: e2e-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-desktop:
    name: e2e-desktop · ${{ matrix.project }} · shard ${{ matrix.shard }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps ${{ matrix.project }}

      - name: Install Playwright OS deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps ${{ matrix.project }}

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080 >/dev/null; then
              echo "preview is up"; exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"; exit 1

      # Filtro por specs de foco/back-forward — mantém o pipeline enxuto
      # e concentra os retries/traces onde a flakiness aparece.
      - name: Run Playwright tests (focus + back/forward)
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          CI: 'true'
        run: |
          bunx playwright test \
            --project=${{ matrix.project }} \
            --shard=${{ matrix.shard }}/${{ matrix.shardTotal }} \
            tests/e2e/desktop-glossary-return-rosary-focus.spec.ts \
            tests/e2e/desktop-glossary-return-rosary-back-forward.spec.ts \
            tests/e2e/desktop-rosary-history-focus.spec.ts \
            tests/e2e/rosary-restore-noHash-focus-live.spec.ts

      # Publica HTML + traces + screenshots por shard SEMPRE que falhar,
      # para permitir triagem por (browser, shard).
      - name: Upload Playwright HTML report (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-report-${{ matrix.project }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test-results (traces / screenshots / videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-artifacts-${{ matrix.project }}-shard${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Em runs bem-sucedidas mantém o HTML por menos tempo para consulta rápida.
      - name: Upload Playwright HTML report (success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-report-success-${{ matrix.project }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
