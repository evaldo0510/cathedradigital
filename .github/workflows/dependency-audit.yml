name: Dependency Audit (High/Critical Gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Reexecução diária às 05:00 UTC para pegar novos advisories sem novos commits
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit (produção + dev)
        id: audit
        run: |
          set -o pipefail
          bun audit --json > audit.json || true
          HIGH=$(jq '[.. | objects | select(.severity? == "high")]     | length' audit.json 2>/dev/null || echo 0)
          CRIT=$(jq '[.. | objects | select(.severity? == "critical")] | length' audit.json 2>/dev/null || echo 0)
          echo "high=$HIGH"     >> "$GITHUB_OUTPUT"
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          echo "::notice::deps high=$HIGH critical=$CRIT"

      - name: Fail on new high/critical vulnerabilities
        run: |
          HIGH=${{ steps.audit.outputs.high }}
          CRIT=${{ steps.audit.outputs.critical }}
          if [ "${CRIT:-0}" -gt 0 ] || [ "${HIGH:-0}" -gt 0 ]; then
            echo "::error::Build bloqueado: encontradas $CRIT crítica(s) e $HIGH alta(s) em dependências."
            echo "Rode 'bun audit' localmente, atualize o pacote afetado e reabra o PR."
            exit 1
          fi
          echo "✅ Nenhuma vulnerabilidade high/critical encontrada."

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit.json
