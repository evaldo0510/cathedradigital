name: Dependency Audit (High/Critical Gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Reexecução diária às 05:00 UTC para pegar novos advisories sem novos commits
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Enviar Slack/comentário mesmo se o conjunto de high/critical não mudou'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      reset_baseline:
        description: 'Ignorar baseline anterior (força regeneração completa)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      baseline_ref:
        description: 'Ref para baixar o baseline (branch, tag ou commit). Padrão: main'
        required: false
        default: 'main'
        type: string
      open_update_pr:
        description: 'Abrir PR automático com bun add nas versões-alvo quando o conjunto de blockers mudar'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
    outputs:
      has_blockers: ${{ steps.summary.outputs.has_blockers }}
      blockers_changed: ${{ steps.summary.outputs.blockers_changed }}
      has_pr_commands: ${{ steps.summary.outputs.has_pr_commands }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolver ref do baseline
        id: baseline_ref
        run: |
          REF="${{ inputs.baseline_ref }}"
          echo "ref=${REF:-main}" >> "$GITHUB_OUTPUT"

      - name: Download baseline (execução anterior em ${{ steps.baseline_ref.outputs.ref }})
        id: baseline
        if: inputs.reset_baseline != 'true'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: dependency-audit.yml
          branch: ${{ steps.baseline_ref.outputs.ref }}
          name: dependency-audit-report
          path: REPORTS/audit-baseline
          if_no_artifact_found: warn

      - name: Preparar baseline
        run: |
          mkdir -p REPORTS/audit
          if [ -f REPORTS/audit-baseline/findings.json ]; then
            cp REPORTS/audit-baseline/findings.json REPORTS/audit/previous-findings.json
            echo "Baseline carregada de ref: ${{ steps.baseline_ref.outputs.ref }}"
          else
            echo "Sem baseline em ${{ steps.baseline_ref.outputs.ref }} — diff será omitido."
          fi

      - name: Run bun audit
        run: |
          set -o pipefail
          bun audit --json > audit.json || true
          echo "Bytes: $(wc -c < audit.json)"

      - name: Montar URL do artefato
        id: artifact_url
        run: |
          echo "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts" >> "$GITHUB_OUTPUT"

      - name: Gerar resumo + diff + recomendações
        id: summary
        run: node scripts/audit-summary.mjs audit.json --artifact-url "${{ steps.artifact_url.outputs.url }}"

      - name: Publicar resumo no Job Summary
        if: always()
        run: cat REPORTS/audit/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload relatório completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: |
            audit.json
            REPORTS/audit/summary.md
            REPORTS/audit/summary.html
            REPORTS/audit/findings.json
            REPORTS/audit/blockers.json
            REPORTS/audit/ignored.json
            REPORTS/audit/pr-body.md
            REPORTS/audit/pr-commands.sh
          retention-days: 90

      - name: Atualizar GitHub Check com o resumo
        if: always()
        uses: LouisBrunner/checks-action@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Dependency Audit — Resumo
          conclusion: ${{ steps.summary.outputs.has_blockers == 'true' && 'failure' || 'success' }}
          output: |
            {"title":"crit=${{ steps.summary.outputs.critical }} · high=${{ steps.summary.outputs.high }} · mod=${{ steps.summary.outputs.moderate }} · low=${{ steps.summary.outputs.low }}","summary":"Δ novas=${{ steps.summary.outputs.added }} · resolvidas=${{ steps.summary.outputs.removed }} · blockers_changed=${{ steps.summary.outputs.blockers_changed }}"}
          output_text_description_file: REPORTS/audit/summary.md

      # Só comenta no PR quando o conjunto de high/critical mudou — ou quando force_notify=true.
      - name: Comentar no PR (sticky) — apenas se mudou
        if: >-
          github.event_name == 'pull_request' &&
          (steps.summary.outputs.blockers_changed == 'true' || inputs.force_notify == 'true')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dependency-audit
          path: REPORTS/audit/summary.md

      - name: Notificar Slack — apenas em mudança de high/critical
        if: >-
          always() &&
          steps.summary.outputs.has_blockers == 'true' &&
          (steps.summary.outputs.blockers_changed == 'true' || inputs.force_notify == 'true') &&
          env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
          CRIT: ${{ steps.summary.outputs.critical }}
          HIGH: ${{ steps.summary.outputs.high }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          ARTIFACT_URL: ${{ steps.artifact_url.outputs.url }}
        run: |
          PKGS=$(jq -r '[.[] | "\(.name) → \(.recommended // "sem alvo")"] | join("\n• ")' REPORTS/audit/blockers.json)
          TEXT=$(printf ":rotating_light: *Dependency audit* — %s crítica(s), %s alta(s) em \`%s@%s\`\n• %s\n<%s|Baixar audit.json>" "$CRIT" "$HIGH" "$REPO" "$REF" "$PKGS" "$ARTIFACT_URL")
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$(jq -nc --arg t "$TEXT" '{text:$t}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Falhar build em high/critical
        if: steps.summary.outputs.has_blockers == 'true'
        run: |
          echo "::error::Build bloqueado: ${{ steps.summary.outputs.critical }} crítica(s), ${{ steps.summary.outputs.high }} alta(s). Veja o Check 'Dependency Audit — Resumo' ou o artefato."
          exit 1
