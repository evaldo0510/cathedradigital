name: Playwright CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps ${{ matrix.project }}

      - name: Install Playwright OS deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps ${{ matrix.project }}

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080 >/dev/null; then
              echo "preview is up"; exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"; exit 1

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          CI: 'true'
        run: bunx playwright test --project=${{ matrix.project }}

      - name: PR Summary Table (Playwright)
        if: github.event_name == 'pull_request' && always()
        run: |
          echo "### 🎭 Playwright Results (${{ matrix.project }})" >> $GITHUB_STEP_SUMMARY
          if [ -d playwright-report ]; then
            echo "| Status | Relatório | Artefatos |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ job.status }} | [HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) | [Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test-results (screenshots / videos / traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080 >/dev/null; then
              echo "preview is up"; exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"; exit 1

      - name: Install Lighthouse CLI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse (Mobile & Desktop)
        run: |
          mkdir -p lighthouse-reports
          # Mobile
          lhci collect --url=http://127.0.0.1:8080 --settings.emulatedFormFactor=mobile --settings.throttlingMethod=simulate
          mv .lighthouseci/default/*.html lighthouse-reports/mobile.html
          rm -rf .lighthouseci
          # Desktop
          lhci collect --url=http://127.0.0.1:8080 --settings.emulatedFormFactor=desktop --settings.throttlingMethod=simulate
          mv .lighthouseci/default/*.html lighthouse-reports/desktop.html

      - name: PR Summary Table (Lighthouse)
        if: github.event_name == 'pull_request' && always()
        run: |
          echo "### ⚡ Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "| Device | Report |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile | [Download Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Desktop | [Download Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
