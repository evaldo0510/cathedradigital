name: Playwright CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps ${{ matrix.project }}

      - name: Install Playwright OS deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps ${{ matrix.project }}

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080 >/dev/null; then
              echo "preview is up"; exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"; exit 1

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          CI: 'true'
        run: bunx playwright test --project=${{ matrix.project }}

      # Sempre que houver falha, suba TUDO: relatório HTML, screenshots, vídeos e traces
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test-results (screenshots / videos / traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Em runs bem-sucedidas mantemos o relatório resumido por menos tempo
      - name: Upload Playwright HTML report (success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-success-${{ matrix.project }}
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
