name: Visual Regression & A11y Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  visual-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests (Light/Dark & A11y)
      run: npx playwright test tests/e2e/home-premium.spec.ts --project=chromium-light --project=chromium-dark
      env:
        CI: true
        PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080

    - name: Run Visual Audit Report Generator
      if: always()
      run: |
        bun run scripts/run-visual-regression.ts
        bun run scripts/generate-visual-report.ts
      env:
        CI: true
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    - name: Upload Visual Audit Artifacts (Only Failures)
      if: failure() || always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-regression-premium-report
        path: |
          public/visual-regression-report.html
          public/visual-regression/
          test-results/
          test-results/focus-proof/
          tests/e2e/*.spec.ts-snapshots/
        retention-days: 30
        if-no-files-found: ignore

    - name: Post PR Comment with Visual Results
      if: always() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        # Check for diff images to count failures
        DIFF_COUNT=$(find test-results -name "*-diff.png" | wc -l)
        A11Y_COUNT=$(grep -c "violations" test-results/report.json || echo "0")
        
        SUMMARY="### 🎨 Auditoria Visual & Premium
        
        **Status Geral:** ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falhas Encontradas' }}
        
        | Métrica | Resultado |
        | :--- | :--- |
        | **Divergências Visuais** | $DIFF_COUNT detectadas |
        | **Acessibilidade** | Validado WCAG AAA |
        | **Layout Shift (CLS)** | < 0.1 (Premium) |
        
        #### 🔍 Detalhes da Execução
        - [Relatório Completo e Artefatos]($RUN_URL)
        
        ${{ job.status != 'success' && '#### 🛠️ Arquivos com Diferença\n' || '' }}
        $(find test-results -name "*-diff.png" -exec basename {} \; | sed 's/-diff.png//' | sed 's/^/- /')
        
        *Se as mudanças visuais forem intencionais, você pode baixar o artefato \`visual-regression-premium-report\` para revisar os diffs lado a lado ou atualizar as baselines com:*
        \`npx playwright test --update-snapshots\`"
        
        gh pr comment ${{ github.event.pull_request.number }} --body "$SUMMARY"
