name: Visual Regression & A11y Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  visual-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests (All Browsers & Themes)
      run: npx playwright test tests/e2e/home-premium.spec.ts
      env:
        CI: true
        PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080

    - name: Run Visual Audit Report Generator
      if: always()
      run: bun run scripts/run-visual-regression.ts
      env:
        CI: true
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    - name: Upload Visual Audit Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-regression-premium-report
        path: |
          public/visual-regression-report.html
          public/visual-regression/
          test-results/
          tests/e2e/*.spec.ts-snapshots/
        retention-days: 30
