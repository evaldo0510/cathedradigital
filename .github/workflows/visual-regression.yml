name: Quality Audit (Visual, A11y & SEO)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  visual-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required by Chromatic

    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Spacing & Rhythm Audit
      run: |
        bun run test:spacing-audit
      env:
        CI: true

    - name: Run Playwright Visual Audit & Capture Chromatic Archives
      run: |
        npx playwright test tests/e2e/visual-regression.spec.ts
      env:
        CI: true
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    - name: Run Chromatic and Fail on Visual Changes
      run: |
        npx chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} --playwright --exit-once-uploaded --auto-accept-changes "main"
      env:
        CI: true

    - name: Run SEO & Sitemap Audit
      run: |
        bun run scripts/run-visual-regression.ts
        npx playwright test tests/e2e/home-seo.spec.ts tests/e2e/sitemap-delivery.spec.ts
      env:
        CI: true
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    - name: Upload Audit Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-audit-reports
        path: |
          public/visual-regression-report.html
          public/visual-regression/
          test-results/
          test-results/seo-audit-report.html
          spacing-audit-report.json
        retention-days: 30
