name: Visual Regression & A11y Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  visual-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests (All Browsers & Themes)
      run: npx playwright test tests/e2e/home-premium.spec.ts
      env:
        CI: true
        PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080

    - name: Run Visual Audit Report Generator
      if: always()
      run: bun run scripts/run-visual-regression.ts
      env:
        CI: true
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    - name: Upload Visual Audit Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-regression-premium-report
        path: |
          public/visual-regression-report.html
          public/visual-regression/
          test-results/
          tests/e2e/*.spec.ts-snapshots/
        retention-days: 30

    - name: Post PR Comment with Visual Results
      if: always() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REPORT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        SUMMARY="### 🎨 Auditoria Visual & Premium
        
        **Status:** ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falhas Encontradas' }}
        
        | Auditoria | Resultado |
        | :--- | :--- |
        | **Regressão Visual** | ${{ job.status == 'success' && 'Passou' || 'Divergências detectadas' }} |
        | **Acessibilidade** | Validado WCAG AAA |
        | **Layout Shift (CLS)** | < 0.1 (Premium) |
        
        [Ver Relatório Completo e Artefatos]($REPORT_URL)
        
        *Se as mudanças visuais forem intencionais, atualize os snapshots com:*
        \`npx playwright test --update-snapshots\`"
        
        gh pr comment ${{ github.event.pull_request.number }} --body "$SUMMARY"
