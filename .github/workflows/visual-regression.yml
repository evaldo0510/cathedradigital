name: Visual Regression & A11y Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  visual-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests (Light/Dark & A11y)
      run: npx playwright test tests/e2e/home-premium.spec.ts tests/e2e/accessibility.spec.ts tests/e2e/hero-visuals.spec.ts --project=chromium-light --project=chromium-dark
      env:
        CI: true
        PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
        A11Y_MAX_CRITICAL_ERRORS: 5 # Configurable limit as requested

    - name: Run Visual Audit Report Generator
      if: always()
      run: |
        bun run scripts/run-visual-regression.ts
        bun run scripts/generate-visual-report.ts
        bun run scripts/validate-a11y-report.ts
      env:
        CI: true
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    - name: Upload Visual Audit Artifacts (Only Failures)
      if: failure() || always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-regression-premium-report
        path: |
          public/visual-regression-report.html
          public/visual-regression/
          public/a11y-reports/
          test-results/
          test-results/focus-proof/
          tests/e2e/*.spec.ts-snapshots/
        retention-days: 30
        if-no-files-found: ignore

    - name: Post PR Comment with Visual Results
      if: always() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        TRACE_URL="https://playwright.dev/docs/trace-viewer"
        
        # Check for diff images to count failures
        DIFF_COUNT=$(find test-results -name "*-diff.png" | wc -l)
        
        SUMMARY="### 🎨 Auditoria Visual & Premium
        
        **Status Geral:** ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falhas Encontradas' }}
        
        | Métrica | Resultado |
        | :--- | :--- |
        | **Divergências Visuais** | $DIFF_COUNT detectadas |
        | **Acessibilidade** | Validado WCAG AAA |
        | **Foco & Navegação** | Verificado (Foco inicial/Destino/Volta) |
        
        #### 🔍 Detalhes e Artefatos
        - [♿ Relatório de Acessibilidade (index.html)]($RUN_URL#artifacts)
        - [🎨 Galeria de Foco (index.html)]($RUN_URL#artifacts)
        - [📊 Relatório Visual Premium (HTML)]($RUN_URL#artifacts)
        - [🔍 Playwright Trace Viewer]($TRACE_URL)
        
        ${{ job.status != 'success' && '#### 🛠️ Falhas por Categoria\n' || '' }}
        $(find test-results -maxdepth 2 -type d -name "*failed*" | sed 's|test-results/||' | sed 's/^/- /')
        
        *Se houver falhas, baixe o artefato \`visual-regression-premium-report\` e abra o \`index.html\` para ver as capturas de foco.*"
        
        gh pr comment ${{ github.event.pull_request.number }} --body "$SUMMARY"
