name: Edge bible-text

on:
  pull_request:
    paths:
      - 'supabase/functions/bible-text/**'
      - 'supabase/functions/_shared/bibleCanon.ts'
      - 'supabase/functions/_shared/bibleCanon.test.ts'
      - 'supabase/functions/_shared/bibleTextSchema.ts'
      - 'supabase/functions/_shared/bibleTextSchema.test.ts'
      - 'scripts/edge-bible-text-summary.ts'
      - 'tests/e2e/bible-text-edge.spec.ts'
      - '.github/workflows/edge-bible-text.yml'
  push:
    branches: [main]

jobs:
  canon-tests:
    name: bibleCanon + schema unit tests + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Prepare reports dir
        run: mkdir -p reports/edge

      - name: Run Deno unit tests (canon + schema)
        run: |
          deno test --allow-net --allow-env \
            supabase/functions/_shared/bibleCanon.test.ts \
            supabase/functions/_shared/bibleTextSchema.test.ts \
            --reporter=pretty 2>&1 | tee reports/edge/deno-${{ github.run_id }}.log

      - name: Smoke "1tm 3" (expect 200)
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          out=reports/edge/bible-text-1tm-3-${ts}.json
          http=$(curl -sS -o "$out" -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/bible-text" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "x-correlation-id: ci-${{ github.run_id }}-ok" \
            -d '{"abbrev":"1tm","chapter":3}')
          echo "HTTP $http -> $out"
          test "$http" = "200"

      - name: Smoke "xx 1" (expect 404 descritivo)
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          out=reports/edge/bible-text-xx-1-${ts}.json
          http=$(curl -sS -o "$out" -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/bible-text" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "x-correlation-id: ci-${{ github.run_id }}-404" \
            -d '{"abbrev":"xx","chapter":1}')
          echo "HTTP $http -> $out"
          test "$http" = "404"

      - name: Generate CI summary + trend chart + regression gate
        if: always()
        env:
          # Thresholds — qualquer contagem ACIMA destes valores falha o job.
          BIBLE_TEXT_MAX_UNKNOWN_ABBREV: '1'        # esperamos exatamente 1 (smoke "xx 1")
          BIBLE_TEXT_MAX_CHAPTER_UNAVAILABLE: '1'   # E2E gn 999 produz 1
          BIBLE_TEXT_MAX_INVALID_PAYLOAD: '1'       # E2E invalid produz 1
          BIBLE_TEXT_MAX_OTHER: '0'
        run: deno run --allow-read --allow-write --allow-env scripts/edge-bible-text-summary.ts

      - name: Upload full edge reports (todos os JSONs + trend + SUMMARY)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-bible-text-trend
          path: reports/edge
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload trend.json (comparação entre execuções)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-bible-text-trend-json
          path: reports/edge/trend.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload SUMMARY.md (resumo + gráfico ASCII)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-bible-text-summary
          path: reports/edge/SUMMARY.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload trend-chart.svg (gráfico de tendência)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-bible-text-chart-svg
          path: reports/edge/trend-chart.svg
          retention-days: 90
          if-no-files-found: ignore
