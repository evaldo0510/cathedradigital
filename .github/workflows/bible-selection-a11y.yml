name: bible selection a11y (axe)

# Falha o build em violações críticas/sérias no estado selecionado
# do capítulo/livro e após navegação por setas.

on:
  pull_request:
    paths:
      - 'src/components/cathedra/Bible.tsx'
      - 'tests/e2e/bible-selection-a11y-kb.spec.ts'
      - 'tests/e2e/bible-selection-keyboard.spec.ts'
      - 'tests/e2e/bible-selection-focus.spec.ts'
      - '.github/workflows/bible-selection-a11y.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  bible-selection-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium + WebKit
        run: bunx playwright install --with-deps chromium webkit

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bunx vite preview --port 8080 --strictPort &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/ > /dev/null; then echo "preview ready"; break; fi
            sleep 1
          done

      - name: Run bible selection a11y + keyboard suites
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          CI: 'true'
        run: |
          bunx playwright test \
            tests/e2e/bible-selection-a11y-kb.spec.ts \
            tests/e2e/bible-selection-keyboard.spec.ts \
            tests/e2e/bible-selection-focus.spec.ts \
            --reporter=list,html,json

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then kill "$(cat /tmp/preview.pid)" || true; fi

      - name: Append summary
        if: always()
        run: |
          echo "## Bible Selection A11y Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f playwright-report/results.json ]; then
            node -e "
              const r = require('./playwright-report/results.json');
              const stats = r.stats || {};
              console.log('- Expected: ' + (stats.expected||0));
              console.log('- Unexpected: ' + (stats.unexpected||0));
              console.log('- Flaky: ' + (stats.flaky||0));
              console.log('- Skipped: ' + (stats.skipped||0));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bible-selection-a11y-report
          path: |
            playwright-report
            test-results
          retention-days: 30
