name: S0 · Sandbox Incidents (validators)

on:
  push:
    paths:
      - 'scripts/validate-incidents-csv.ts'
      - 'scripts/verify-incident-hash.ts'
      - 'scripts/__tests__/validate-incidents-csv.test.ts'
      - 'scripts/__tests__/verify-incident-hash.test.ts'
      - 'docs/evidencias/mp-sandbox/**'
  pull_request:
    paths:
      - 'scripts/validate-incidents-csv.ts'
      - 'scripts/verify-incident-hash.ts'
      - 'scripts/__tests__/validate-incidents-csv.test.ts'
      - 'scripts/__tests__/verify-incident-hash.test.ts'
      - 'docs/evidencias/mp-sandbox/**'
  workflow_dispatch:

jobs:
  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests (validators)
        run: bunx vitest run scripts/__tests__/validate-incidents-csv.test.ts scripts/__tests__/verify-incident-hash.test.ts

      # Regressão contra o CSV real: o template atual tem placeholders esperados,
      # então validator retorna exit 1 (comportamento correto). O hash-check pode
      # falhar quando o arquivo de payload é fictício. Capturamos os relatórios
      # como artefatos sem quebrar o CI.
      - name: Regressão — validate-incidents-csv (informativo)
        continue-on-error: true
        run: bunx tsx scripts/validate-incidents-csv.ts
      - name: Regressão — verify-incident-hash (informativo)
        continue-on-error: true
        run: bunx tsx scripts/verify-incident-hash.ts
      - name: Upload relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s0-sandbox-reports
          path: |
            docs/evidencias/mp-sandbox/VALIDATION-REPORT.md
            docs/evidencias/mp-sandbox/HASH-CHECK-REPORT.md
          if-no-files-found: ignore
