name: Compliance & Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compliance-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Run I18n & Glossary Consistency Tests
        id: i18n_tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          bunx playwright test tests/e2e/i18n-coverage.spec.ts --reporter=list

      - name: Run RLS Security Integration Tests
        id: security_tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          bunx playwright test tests/e2e/bible-audit-security.spec.ts --reporter=json > test-results.json

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body = '## 🚨 Compliance CI Blocked\n\nIdentificamos pendências que impedem a implantação:\n\n';
            
            if (fs.existsSync('tests/reports/i18n-release-check.json')) {
              const i18n = JSON.parse(fs.readFileSync('tests/reports/i18n-release-check.json', 'utf8'));
              body += '### 🌐 Inconsistências de Localização (i18n):\n';
              i18n.failures.forEach(f => {
                body += `- **${f.term}**: Sugerido "${f.expected}" em ${f.context}\n`;
              });
              body += '\n';
            }

            if (fs.existsSync('test-results.json')) {
              const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const failures = results.suites[0].suites.flatMap(s => s.tests).filter(t => t.results[0].status === 'failed');
              if (failures.length > 0) {
                body += '### 🔒 Falhas de Segurança RLS:\n';
                failures.forEach(f => {
                  body += `- **${f.title}**: ${f.results[0].error.message.split('\n')[0]}\n`;
                });
              }
            }
            
            body += '\n---\n';
            body += '[Ver Detalhes no Log](' + process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID + ')';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::CI Deployment Blocked: I18n or Security issues found."
