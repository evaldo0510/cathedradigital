name: Governance & Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  layout-governance:
    name: 📏 Layout Governance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Run Layout Audit
        run: bun run scripts/audit-layout-governance.ts

  visual-regression:
    name: 📸 Layout Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Visual Tests
        run: bunx playwright test tests/e2e/visual-regression-consolidated.spec.ts --reporter=json > test-results/visual-regression-consolidated.json || true
      - name: Generate PR Comment
        if: github.event_name == 'pull_request'
        run: bun run scripts/generate-layout-comment.ts > layout-comment.md
      - name: Post Layout Comment
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: layout-comment.md
          comment_tag: layout-regression-summary
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 30

  # ... Rest of existing jobs ...
  unit-tests:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    # ... (keep existing)

