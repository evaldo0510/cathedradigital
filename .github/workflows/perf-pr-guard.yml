name: perf-pr-guard

on:
  pull_request:
    paths:
      - 'src/hooks/useAdminDashboardData.ts'
      - 'src/pages/**/TelemetryDashboard*'
      - 'supabase/migrations/**'
      - 'docs/perf-baselines/**'
      - 'docs/perf-benchmark.config.yaml'
      - 'scripts/perf-*'
      - '.github/workflows/perf-pr-guard.yml'

concurrency:
  group: perf-pr-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Banco de shadow/staging usado só para EXPLAIN + benchmark curto.
      PG_URL: ${{ secrets.STAGING_PG_URL }}
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      PERF_BASELINE: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }

      - name: Skip when secrets ausentes (forks)
        id: guard
        run: |
          if [ -z "$PG_URL" ] || [ -z "$VITE_SUPABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR de fork ou secrets não disponíveis; guard pulado."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.guard.outputs.skip == 'false'
        run: bun install --frozen-lockfile

      - name: Install pg driver
        if: steps.guard.outputs.skip == 'false'
        run: bun add -d pg @types/pg

      - name: Snapshot EXPLAIN atual
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p .perf
          bunx tsx scripts/perf-baseline-snapshot.ts --env=ci
          cp docs/perf-baselines/ci/latest.json .perf/current-baseline.json

      - name: Diff vs baseline versionado (staging)
        if: steps.guard.outputs.skip == 'false'
        id: diff
        continue-on-error: true
        run: |
          bunx tsx scripts/perf-baseline-diff-report.ts \
            --baseline=docs/perf-baselines/staging/latest.json \
            --current=.perf/current-baseline.json \
            --out=.perf/diff.md \
            --json=.perf/diff.json \
            --annotations=.perf/annotations.json \
            --source-hint=docs/perf-baselines/README.md

      - name: Benchmark rápido (perfil CI)
        if: steps.guard.outputs.skip == 'false'
        id: bench
        continue-on-error: true
        run: |
          bunx tsx scripts/perf-benchmark-app-metrics.ts \
            --env=ci \
            --config=docs/perf-benchmark.config.yaml \
            --baseline=docs/perf-baselines/ci/bench-latest.json \
            --out=.perf/bench.json

      - name: Publicar Check com annotations
        if: steps.guard.outputs.skip == 'false' && always() && hashFiles('.perf/annotations.json') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const annotations = JSON.parse(fs.readFileSync('.perf/annotations.json', 'utf8'));
            const errors = annotations.filter(a => a.annotation_level === 'failure').length;
            const warnings = annotations.filter(a => a.annotation_level === 'warning').length;
            const conclusion = errors > 0 ? 'failure' : (warnings > 0 ? 'neutral' : 'success');
            // GitHub Checks API aceita no máximo 50 annotations por chamada.
            const chunk = annotations.slice(0, 50);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'perf-pr-guard: query regressions',
              head_sha: context.payload.pull_request?.head?.sha ?? context.sha,
              status: 'completed',
              conclusion,
              output: {
                title: `${errors} regressão(ões), ${warnings} aviso(s)`,
                summary: fs.readFileSync('.perf/diff.md', 'utf8').slice(0, 60000),
                annotations: chunk,
              },
            });

      - name: Comentar no PR (sticky)
        if: steps.guard.outputs.skip == 'false' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: perf-pr-guard
          path: .perf/diff.md

      - name: Upload artifacts
        if: steps.guard.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-pr-guard-${{ github.run_id }}
          path: .perf/
          retention-days: 14

      - name: Bloquear merge em caso de regressão
        if: steps.guard.outputs.skip == 'false' && (steps.diff.outcome == 'failure' || steps.bench.outcome == 'failure')
        run: |
          echo "::error::perf-pr-guard detectou regressão bloqueante (ver Check 'perf-pr-guard: query regressions')."
          exit 1
