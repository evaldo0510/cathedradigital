name: bible-primary-guardrail

# P0.2.1 — Falha o CI se a governança da tradução primária da Bíblia
# for quebrada (silent-pick, fallback paralelo, RPC indisponível,
# múltiplas primárias).

on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/bible-primary-guardrail.ts'
      - '.github/workflows/bible-primary-guardrail.yml'
  push:
    branches: [main]

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run guardrail (code checks only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            bun run scripts/bible-primary-guardrail.ts
          else
            bun run scripts/bible-primary-guardrail.ts --skip-db
          fi
