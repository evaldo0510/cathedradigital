name: Contrast (WCAG) — copy components

# Fails the build when the WCAG contrast ratio of the copy components
# (canonical_abbr / bollsId on /bible-abbr-validate) drops below AA in
# either light or dark mode.

on:
  pull_request:
    paths:
      - 'src/pages/BibleAbbrValidatePage.tsx'
      - 'src/index.css'
      - 'tailwind.config.ts'
      - 'src/components/dev/ContrastInspector.tsx'
      - 'tests/e2e/bible-abbr-validate-copy-contrast.spec.ts'
      - '.github/workflows/contrast-copy-components.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bunx vite preview --port 8080 --strictPort &
          echo $! > /tmp/preview.pid
          # Wait for server to be reachable.
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/ > /dev/null; then
              echo "preview ready"
              break
            fi
            sleep 1
          done

      - name: Run contrast tests (light + dark)
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          CI: 'true'
        run: |
          bunx playwright test tests/e2e/bible-abbr-validate-copy-contrast.spec.ts \
            --reporter=list,html,json

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then kill "$(cat /tmp/preview.pid)" || true; fi

      - name: Upload Playwright report + attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: |
            playwright-report
            test-results
          retention-days: 14
