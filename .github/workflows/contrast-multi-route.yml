name: Contrast (WCAG) — multi-route

# Runs the data-driven WCAG contrast spec across all covered routes in light
# and dark mode. Compares against the previous main-branch baseline, fails the
# build ONLY on regressions (new failures or worsened ratios), posts a sticky
# PR comment with the report table, and publishes the HTML report + summary.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tailwind.config.ts'
      - 'tests/e2e/contrast-routes.spec.ts'
      - 'tests/e2e/contrast.config.ts'
      - 'tests/e2e/bible-abbr-validate-copy-contrast.spec.ts'
      - 'scripts/contrast-report.ts'
      - '.github/workflows/contrast-multi-route.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      # ---------- baseline ----------
      - name: Download baseline (last green main run)
        id: baseline
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: contrast-multi-route.yml
          branch: main
          name: contrast-baseline
          path: baseline
          if_no_artifact_found: warn

      - name: Resolve baseline path
        id: baselineenv
        run: |
          if [ -f baseline/contrast-summary.json ]; then
            echo "path=baseline/contrast-summary.json" >> "$GITHUB_OUTPUT"
            echo "Found baseline: baseline/contrast-summary.json"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No baseline found — first run will seed it."
          fi

      # ---------- run ----------
      - name: Start preview server
        run: |
          bunx vite preview --port 8080 --strictPort &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/ > /dev/null; then echo "preview ready"; break; fi
            sleep 1
          done

      - name: Run contrast suites (light + dark, multi-route)
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          CI: 'true'
        # Aggregator decides pass/fail based on baseline diff; let Playwright finish either way.
        continue-on-error: true
        run: |
          bunx playwright test \
            tests/e2e/contrast-routes.spec.ts \
            tests/e2e/bible-abbr-validate-copy-contrast.spec.ts \
            --reporter=list,html,json

      - name: Aggregate report + baseline diff
        id: aggregate
        env:
          PLAYWRIGHT_REPORT_DIR: playwright-report
          PLAYWRIGHT_JSON_REPORT: playwright-report/results.json
          PLAYWRIGHT_TEST_RESULTS_DIR: test-results
          CONTRAST_BASELINE: ${{ steps.baselineenv.outputs.path }}
          # On PRs: fail only on regressions. On main pushes: never fail (always seed).
          CONTRAST_REPORT_FAIL_MODE: ${{ github.event_name == 'pull_request' && 'regressions' || 'never' }}
          # Ignore "worsened" entries whose drop is below this ratio (absorbs jitter).
          CONTRAST_DELTA_THRESHOLD: '0.15'
        run: bunx tsx scripts/contrast-report.ts

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then kill "$(cat /tmp/preview.pid)" || true; fi

      # ---------- publish ----------
      - name: Append summary to job step
        if: always()
        run: |
          if [ -f playwright-report/contrast-summary.md ]; then
            cat playwright-report/contrast-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sticky PR comment with contrast report
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: contrast-wcag-report
          path: playwright-report/contrast-summary.md

      - name: Upload Playwright report + contrast summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Upload new baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-baseline
          path: playwright-report/contrast-summary.json
          retention-days: 90
