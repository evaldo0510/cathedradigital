name: Contrast (WCAG) — multi-route

# Runs the data-driven WCAG contrast spec across all covered routes in light
# and dark mode, fails the build when any measured target drops below the AA
# threshold, and publishes:
#   - playwright-report/                  (HTML report + per-test attachments)
#   - playwright-report/contrast-summary.md
#   - playwright-report/contrast-summary.json

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tailwind.config.ts'
      - 'tests/e2e/contrast-routes.spec.ts'
      - 'tests/e2e/bible-abbr-validate-copy-contrast.spec.ts'
      - 'scripts/contrast-report.ts'
      - '.github/workflows/contrast-multi-route.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bunx vite preview --port 8080 --strictPort &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/ > /dev/null; then echo "preview ready"; break; fi
            sleep 1
          done

      - name: Run contrast suites (light + dark, multi-route)
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          CI: 'true'
        # `continue-on-error` so we always run the aggregator and upload artifacts;
        # the aggregator script re-fails the job when violations are present.
        continue-on-error: true
        run: |
          bunx playwright test \
            tests/e2e/contrast-routes.spec.ts \
            tests/e2e/bible-abbr-validate-copy-contrast.spec.ts \
            --reporter=list,html,json

      - name: Generate aggregated contrast report
        run: bunx tsx scripts/contrast-report.ts
        env:
          PLAYWRIGHT_REPORT_DIR: playwright-report
          PLAYWRIGHT_JSON_REPORT: playwright-report/results.json
          PLAYWRIGHT_TEST_RESULTS_DIR: test-results
          CONTRAST_REPORT_FAIL_ON_VIOLATIONS: '1'

      - name: Publish summary to job step
        if: always()
        run: |
          if [ -f playwright-report/contrast-summary.md ]; then
            cat playwright-report/contrast-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then kill "$(cat /tmp/preview.pid)" || true; fi

      - name: Upload Playwright report + contrast summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: |
            playwright-report
            test-results
          retention-days: 14
