name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          bun run lint --max-warnings 0 > lint.log 2>&1
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          bun run typecheck > typecheck.log 2>&1
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Unit Tests
        id: vitest
        continue-on-error: true
        run: |
          bun run test:ci > vitest.log 2>&1
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            lint.log
            typecheck.log
            vitest.log

      - name: PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = {
              lint: '${{ steps.lint.outputs.status }}',
              typecheck: '${{ steps.typecheck.outputs.status }}',
              vitest: '${{ steps.vitest.outputs.status }}'
            };
            const icon = (s) => s === '0' ? '✅' : '❌';
            const body = `
            ### 🛠️ Validation Results
            | Step | Status |
            | :--- | :--- |
            | Lint | ${icon(status.lint)} ${status.lint === '0' ? 'Passed' : 'Failed'} |
            | Typecheck | ${icon(status.typecheck)} ${status.typecheck === '0' ? 'Passed' : 'Failed'} |
            | Unit Tests | ${icon(status.vitest)} ${status.vitest === '0' ? 'Passed' : 'Failed'} |
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  e2e:
    name: Playwright E2E & Audit
    runs-on: ubuntu-latest
    needs: validate
    if: always() && needs.validate.result == 'success'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Run E2E & Audits
        id: e2e
        continue-on-error: true
        run: |
          bun run test:audit > e2e-audit.log 2>&1
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            test-results/
            public/visual-regression-report.html
            public/seo-audit-report.html
            e2e-audit.log

      - name: PR Audit Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.e2e.outputs.status }}';
            const body = `
            ### 🎭 E2E & Audit Results
            Status: ${status === '0' ? '✅ Passed' : '❌ Failed'}
            
            Relatórios disponíveis nos artefatos do workflow.
            - Visual Regression Report
            - SEO & Lighthouse Audit
            - Acessibilidade WCAG
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  fail-on-error:
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Pipeline failed."
            exit 1
          fi
