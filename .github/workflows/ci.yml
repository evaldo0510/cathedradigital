name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Typecheck
      id: typecheck
      run: |
        echo "Running tsc --noEmit..."
        bun run typecheck > tsc_output.log 2>&1
        RESULT=$?
        cat tsc_output.log
        if [ $RESULT -ne 0 ]; then
          echo "::error::Typecheck failed. Check tsc_output.log in artifacts."
          exit $RESULT
        fi

    - name: Lint
      id: lint
      run: |
        echo "Running eslint..."
        # We allow warnings to not fail the build for now, but capture all output
        bun run lint > eslint_output.log 2>&1
        RESULT=$?
        cat eslint_output.log
        if [ $RESULT -ne 0 ]; then
          echo "::error::Lint failed. Check eslint_output.log in artifacts."
          exit $RESULT
        fi

    - name: Generate SEO Files
      run: |
        echo "Generating sitemap and robots.txt..."
        bun run scripts/generate-sitemap.ts > sitemap_gen.log 2>&1
        RESULT=$?
        cat sitemap_gen.log
        if [ $RESULT -ne 0 ]; then
          echo "::error::Sitemap generation failed."
          exit $RESULT
        fi

    - name: Validations
      run: |
        EXIT_CODE=0
        
        echo "Validating sitemap..."
        bun run scripts/validate-sitemap.ts > sitemap_val.log 2>&1 || { cat sitemap_val.log; EXIT_CODE=1; echo "::error::Sitemap validation failed."; }
        
        echo "Validating catechism..."
        bun run scripts/validate-catechism.ts > catechism_val.log 2>&1 || { cat catechism_val.log; EXIT_CODE=1; echo "::error::Catechism validation failed."; }
        
        echo "Running security audit..."
        bun run scripts/security-audit.ts > security_audit.log 2>&1 || { cat security_audit.log; EXIT_CODE=1; echo "::error::Security audit failed."; }
        
        exit $EXIT_CODE

    - name: Build
      run: |
        echo "Running vite build..."
        bun run build > build_output.log 2>&1
        RESULT=$?
        cat build_output.log
        if [ $RESULT -ne 0 ]; then
          echo "::error::Vite build failed. Check build_output.log in artifacts."
          exit $RESULT
        fi

    - name: Upload Logs as Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-logs
        path: |
          *.log
          scripts/logs/*.log
