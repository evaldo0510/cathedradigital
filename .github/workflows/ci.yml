name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Lint
        id: lint
        run: |
          bun run lint --max-warnings 0 > lint.log 2>&1

      - name: Typecheck
        id: typecheck
        run: |
          bun run typecheck > typecheck.log 2>&1

      - name: Unit Tests (with Coverage Thresholds)
        id: vitest
        run: |
          bun run test:ci > vitest.log 2>&1

      - name: Generate Diff Map
        id: diff-map
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "MAP_BODY<<EOF" >> $GITHUB_ENV
          echo "### 🔍 Alterações & Cobertura" >> $GITHUB_ENV
          echo "| Arquivo | Mudança | Testes Relacionados |" >> $GITHUB_ENV
          echo "| :--- | :--- | :--- |" >> $GITHUB_ENV
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $file == src/* ]]; then
              # Tenta encontrar teste correspondente
              test_file="${file%.*}.test.tsx"
              if [ ! -f "$test_file" ]; then
                test_file="${file%.*}.test.ts"
              fi
              
              if [ -f "$test_file" ]; then
                coverage="✅ $(basename $test_file)"
              else
                coverage="⚠️ Sem teste direto"
              fi
              
              # Resume a mudança (ex: refactor, logic, ui)
              change_type="Modificação"
              if [[ $file == *"hooks"* ]]; then change_type="Refactor/Lógica"; fi
              if [[ $file == *"components/ui"* ]]; then change_type="UI/Design"; fi
              
              echo "| \`$file\` | $change_type | $coverage |" >> $GITHUB_ENV
            fi
          done
          echo "EOF" >> $GITHUB_ENV

      - name: Extract Coverage Data
        if: github.event_name == 'pull_request' && always()
        id: coverage-data
        shell: bash
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            TOTAL_PCT=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
            # Find files below 80% threshold
            LOW_COVERAGE=$(jq -r '. | to_entries | .[] | select(.key != "total" and .value.lines.pct < 80) | "\(.key): \(.value.lines.pct)%"' coverage/coverage-summary.json | head -n 10)
            if [ -z "$LOW_COVERAGE" ]; then LOW_COVERAGE="Nenhum (Todos acima do limite)"; fi
            
            echo "TOTAL=$TOTAL_PCT" >> $GITHUB_OUTPUT
            {
              echo 'LOW_FILES<<EOF'
              echo "$LOW_COVERAGE"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          else
            echo "TOTAL=N/A" >> $GITHUB_OUTPUT
            echo "LOW_FILES=Sumário não encontrado" >> $GITHUB_OUTPUT
          fi

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              lint: '${{ steps.lint.outcome }}',
              typecheck: '${{ steps.typecheck.outcome }}',
              vitest: '${{ steps.vitest.outcome }}'
            };
            const coverageTotal = '${{ steps.coverage-data.outputs.TOTAL }}';
            const lowFiles = `${{ steps.coverage-data.outputs.LOW_FILES }}`;
            const runId = context.runId;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts`;
            
            const icon = (s) => s === 'success' ? '✅' : '❌';
            const diffMap = process.env.MAP_BODY || '';
            
            const body = `
            ### 🛠️ Resultado do Pipeline (CI)
            | Step | Status | Detalhes |
            | :--- | :--- | :--- |
            | Lint | ${icon(results.lint)} | ${results.lint === 'success' ? 'Passou' : 'Falhou (Max 0 warnings)'} |
            | Typecheck | ${icon(results.typecheck)} | ${results.typecheck === 'success' ? 'Passou' : 'Falhou'} |
            | Testes & Coverage | ${icon(results.vitest)} | **${coverageTotal}%** ${results.vitest === 'success' ? '✅' : '❌'} |
            
            <details>
            <summary><b>📊 Detalhes de Cobertura</b></summary>
            
            **Cobertura Total:** \`${coverageTotal}%\`
            **Relatório Completo (Artifacts):** [Acessar Artifacts](${artifactUrl})
            
            **Arquivos abaixo do threshold (80%):**
            \`\`\`
            ${lowFiles}
            \`\`\`
            </details>
            
            ${diffMap}
            
            ---
            _Thresholds: Lint (0 warnings), Coverage (80% Lines)_
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  e2e:
    name: Playwright E2E & Audit
    runs-on: ubuntu-latest
    needs: validate
    if: always() && needs.validate.result != 'skipped'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Run E2E & Audits (Performance & SEO Thresholds)
        id: e2e
        run: |
          bun run test:audit
        env:
          PERF_THRESHOLD: 80
          SEO_THRESHOLD: 90
          A11Y_THRESHOLD: 100

      - name: Upload Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: playwright-report/

      - name: PR Audit Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.e2e.outcome }}';
            const runId = context.runId;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts`;

            const body = `
            ### 🎭 E2E & Auditoria de Qualidade
            | Verificação | Status |
            | :--- | :--- |
            | Fluxos Críticos | ${outcome === 'success' ? '✅ OK' : '❌ Falha'} |
            | Performance | ${outcome === 'success' ? '✅ >80' : '⚠️ Revisar'} |
            | SEO | ${outcome === 'success' ? '✅ >90' : '⚠️ Revisar'} |
            | Acessibilidade | ${outcome === 'success' ? '✅ 100%' : '⚠️ Falhas'} |
            
            > 📊 **[Baixar Relatórios Detalhados](${artifactUrl})**
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  enforce:
    name: Final Status Enforcer
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Pipeline bloqueado: Thresholds ou testes não atingidos."
            exit 1
          fi

