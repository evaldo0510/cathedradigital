name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Run Unit & Integration Tests (A11y, Reduced Motion, Snapshots, Schema Validation)
        run: bun run test:ci
      - name: Run E2E, Accessibility & Visual Regression Tests
        run: |
          npx playwright install --with-deps chromium
          bun run test:header-mobile
          bun run test:e2e tests/e2e/stability.spec.ts
          bun run test:visual || echo "Visual regression failed, check artifacts"
          bun run test:seo-audit --reporter=json > test-results/seo-audit-report.json || (echo "SEO Audit failed, checking report..." && exit 1)
      - name: Upload Test Results & Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            test-results.json
            tests/e2e/**/*-snapshots/
            test-results/axe/
          retention-days: 7